<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My E-Commerce Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background: #555;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 20px;
        }

        .product {
            background: white;
            border-radius: 5px;
            width: 200px;
            margin: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0px 0px 5px rgba(0,0,0,0.2);
        }

        .product img {
            width: 100%;
        }

        .price {
            color: green;
            font-size: 18px;
            margin: 10px 0;
        }

        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 3px;
        }

        button:hover {
            background: #218838;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #333;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>My Online Store</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Cart</a>
    <a href="#">Contact</a>
</nav>

<div class="container">

    <div class="product">
        <img src="https://via.placeholder.com/200" alt="Product">
        <h3>Wireless Headphones</h3>
        <p class="price">$49.99</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200" alt="Product">
        <h3>Smart Watch</h3>
        <p class="price">$79.99</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200" alt="Product">
        <h3>Bluetooth Speaker</h3>
        <p class="price">$39.99</p>
        <button>Add to Cart</button>
    </div>

</div>

<footer>
    <p>© 2026 My E-Commerce Store</p>
</footer>

</body>
</html>
